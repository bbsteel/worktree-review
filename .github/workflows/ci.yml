name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.8.22"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install package
        run: uv sync --frozen --extra server --group dev

      - name: Ruff
        run: uv run ruff check src tests && uv run ruff format --check src tests

      - name: mypy
        run: uv run mypy

      - name: Tests
        run: uv run pytest
