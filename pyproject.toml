[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mergegate"
dynamic = ["version"]
description = "Identity-bound merge-candidate review gate with GitHub and local CLI surfaces."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "MergeGate" }]
keywords = ["code-review", "merge-gate", "github-app"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "anthropic>=0.40",
  "detect-secrets>=1.5",
  "httpx>=0.28",
  "jsonschema>=4.23",
  "openai>=1.50",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "structlog>=24.4",
  "tenacity>=9.0",
  "tiktoken>=0.8",
  "typer>=0.16",
]

[project.optional-dependencies]
server = [
  "alembic>=1.14",
  "asyncpg>=0.30",
  "fastapi>=0.115",
  "githubkit>=0.12",
  "pgqueuer>=0.19",
  "uvicorn[standard]>=0.32",
]

[project.scripts]
mergegate = "mergegate.cli:main"
mergegate-server = "mergegate.server:main"

[project.urls]
Homepage = "https://github.com/mergegate/mergegate"

[dependency-groups]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.11",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "testcontainers[postgres]>=4.8",
  "types-jsonschema>=4.23",
  "types-pyyaml>=6.0",
]

[tool.hatch.version]
path = "src/mergegate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mergegate"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/pyproject.toml",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["mergegate"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mergegate"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
show_error_codes = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-q", "--strict-markers"]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
]
